<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13"/>
      <stop offset="50%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#141B33"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="glowEffect" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0E1424" stop-opacity="0"/>
    </radialGradient>

    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.6; transform: scale(0.95); transform-origin: center; }
        100% { opacity: 1; transform: scale(1.08); transform-origin: center; }
      }
      .font-badge {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .wave-anim {
        animation: waveShift 8s ease-in-out infinite alternate;
      }
      @keyframes waveShift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-30px); }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="996" height="246" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Radial Glow Behind Text -->
  <circle cx="500" cy="110" r="280" fill="url(#glowEffect)" class="glow-pulse"/>

  <!-- Top Pill Badge -->
  <g transform="translate(365, 32)">
    <rect width="270" height="28" rx="14" fill="#4F46E5" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1"/>
    <text x="135" y="18" fill="#A5B4FC" class="font-badge" text-anchor="middle">✦ NEXT-GEN AI RESUME PLATFORM ✦</text>
  </g>

  <!-- Main Title: ProCV Lite -->
  <text x="500" y="128" text-anchor="middle" class="font-title">
    <tspan fill="#FFFFFF">ProCV </tspan>
    <tspan fill="url(#titleGrad)">Lite</tspan>
  </text>

  <!-- Subtitle -->
  <text x="500" y="165" fill="#94A3B8" class="font-sub" text-anchor="middle">
    AI-Powered Intelligence • Playwright E2E Automation • 100% CI/CD Cloud Pipeline
  </text>

  <!-- Bottom Wavy Decorative Paths -->
  <g class="wave-anim">
    <path d="M-50,215 C150,240 350,185 550,215 C750,245 950,195 1050,220 L1050,250 L-50,250 Z" fill="url(#waveGrad)"/>
    <path d="M-50,225 C200,205 450,245 700,215 C850,200 950,235 1050,225 L1050,250 L-50,250 Z" fill="#6366F1" fill-opacity="0.18"/>
  </g>
</svg>
